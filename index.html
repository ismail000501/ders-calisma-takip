<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ders Çalışma Takip</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100vh;
      font-family: 'Inter', sans-serif;
      touch-action: manipulation;
      -webkit-text-size-adjust: 100%;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo, useCallback } = React;

    const DAYS = ["Pzt", "Sal", "Çar", "Per", "Cum", "Cmt", "Paz"];
    const SUBJECT_COLORS = ["#D97706", "#0D9488", "#6366F1", "#EC4899", "#8B5CF6", "#14B8A6"];

    function colorForSubject(name) {
      let hash = 0;
      for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
      return SUBJECT_COLORS[Math.abs(hash) % SUBJECT_COLORS.length];
    }

    function pad(n) { return String(n).padStart(2, "0"); }
    function formatClock(totalSeconds) {
      const h = Math.floor(totalSeconds / 3600);
      const m = Math.floor((totalSeconds % 3600) / 60);
      const s = totalSeconds % 60;
      return h > 0 ? `${pad(h)}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`;
    }
    function formatMinutes(mins) {
      const h = Math.floor(mins / 60);
      const m = Math.round(mins % 60);
      if (h === 0) return `${m} dk`;
      return `${h} sa ${m} dk`;
    }
    function isoDay(date) { return date.toISOString().slice(0, 10); }
    function mondayIndex(date) { return (date.getDay() + 6) % 7; }

    function StudyTracker() {
      const [loaded, setLoaded] = useState(false);
      const [theme, setTheme] = useState("dark");
      const [sessions, setSessions] = useState([]);
      const [reminders, setReminders] = useState([]);
      const [breaks, setBreaks] = useState([]);
      const [subject, setSubject] = useState("");
      const [isRunning, setIsRunning] = useState(false);
      const [elapsed, setElapsed] = useState(0);
      const tickRef = useRef(null);

      useEffect(() => {
        (async () => {
          try {
            const t = localStorage.getItem("study-theme");
            if (t) setTheme(t);
          } catch (e) {}
          try {
            const s = localStorage.getItem("study-sessions");
            if (s) setSessions(JSON.parse(s));
          } catch (e) {}
          try {
            const r = localStorage.getItem("study-reminders");
            if (r) setReminders(JSON.parse(r));
          } catch (e) {}
          try {
            const b = localStorage.getItem("study-breaks");
            if (b) setBreaks(JSON.parse(b));
          } catch (e) {}
          setLoaded(true);
        })();
      }, []);

      const toggleTheme = () => {
        const nextTheme = theme === "dark" ? "light" : "dark";
        setTheme(nextTheme);
        try { localStorage.setItem("study-theme", nextTheme); } catch (e) {}
      };

      const saveSessions = useCallback((next) => {
        setSessions(next);
        try { localStorage.setItem("study-sessions", JSON.stringify(next)); } catch (e) {}
      }, []);

      const saveReminders = useCallback((next) => {
        setReminders(next);
        try { localStorage.setItem("study-reminders", JSON.stringify(next)); } catch (e) {}
      }, []);

      useEffect(() => {
        if (isRunning) {
          tickRef.current = setInterval(() => setElapsed((e) => e + 1), 1000);
        } else if (tickRef.current) {
          clearInterval(tickRef.current);
        }
        return () => clearInterval(tickRef.current);
      }, [isRunning]);

      const handleStartPause = () => {
        if (!isRunning && !subject.trim()) return;
        setIsRunning((r) => !r);
      };

      const handleFinish = () => {
        if (elapsed < 5) {
          setIsRunning(false);
          setElapsed(0);
          return;
        }
        const minutes = Math.round(elapsed / 60);
        const session = { id: Date.now(), subject: subject.trim() || "Genel", minutes, date: isoDay(new Date()) };
        saveSessions([session, ...sessions]);
        setIsRunning(false);
        setElapsed(0);
      };

      const handleReset = () => {
        setIsRunning(false);
        setElapsed(0);
      };

      const deleteSession = (id) => saveSessions(sessions.filter((s) => s.id !== id));

      const today = isoDay(new Date());
      const todayMinutes = useMemo(() => sessions.filter((s) => s.date === today).reduce((a, s) => a + s.minutes, 0), [sessions, today]);
      const todayBreakMinutes = useMemo(() => breaks.filter((b) => b.date === today).reduce((a, b) => a + b.minutes, 0), [breaks, today]);

      const weekData = useMemo(() => {
        const now = new Date();
        const monday = new Date(now);
        monday.setDate(now.getDate() - mondayIndex(now));
        const days = [];
        for (let i = 0; i < 7; i++) {
          const d = new Date(monday);
          d.setDate(monday.getDate() + i);
          const dISO = isoDay(d);
          const mins = sessions.filter((s) => s.date === dISO).reduce((a, s) => a + s.minutes, 0);
          days.push({ label: DAYS[i], dakika: mins });
        }
        return days;
      }, [sessions]);

      const weekMinutes = weekData.reduce((a, d) => a + d.dakika, 0);

      const isDark = theme === "dark";
      const bgMain = isDark ? "#0B0F19" : "#F8FAFC";
      const colorMain = isDark ? "#E2E8F0" : "#1E293B";
      const bgCard = isDark ? "#131B2E" : "#FFFFFF";
      const borderCard = isDark ? "#1E293B" : "#E2E8F0";
      const textMuted = isDark ? "#94A3B8" : "#64748B";
      const bgInner = isDark ? "#0B0F19" : "#F1F5F9";

      if (!loaded) return null;

      return (
        <div style={{ 
          fontFamily: "'Inter', sans-serif", 
          background: bgMain, 
          color: colorMain, 
          minHeight: "100vh",
          width: "100%",
          padding: "20px 16px 40px", 
          maxWidth: "720px", 
          margin: "0 auto", 
          boxSizing: "border-box" 
        }}>
          
          {/* Sağ Üst Tema Butonu */}
          <div style={{ display: "flex", justifyContent: "flex-end", marginBottom: "12px" }}>
            <button 
              onClick={toggleTheme} 
              style={{ 
                background: bgCard, 
                color: colorMain, 
                border: `1px solid ${borderCard}`, 
                borderRadius: "50%", 
                width: "40px", 
                height: "40px", 
                display: "flex", 
                alignItems: "center", 
                justifyContent: "center", 
                cursor: "pointer",
                fontSize: "18px",
                boxShadow: "0 2px 5px rgba(0,0,0,0.1)"
              }}
              title="Temayı Değiştir"
            >
              {isDark ? "🌞" : "🌙"}
            </button>
          </div>

          <div style={{ textAlign: "center", marginBottom: "8px" }}>
            <p style={{ fontSize: "13px", color: textMuted, margin: "0 0 4px" }}>DERS ÇALIŞMA SAYACI</p>
          </div>

          <div style={{ textAlign: "center", margin: "20px 0", fontSize: "40px", fontWeight: "bold", fontFamily: "serif" }}>
            {formatClock(elapsed)}
          </div>

          <div style={{ display: "flex", gap: "8px", justifyContent: "center", marginBottom: "14px" }}>
            <input placeholder="Ne çalışıyorsun? (ör. Matematik)" value={subject} onChange={(e) => setSubject(e.target.value)} disabled={isRunning} style={{ width: "100%", maxWidth: "280px", padding: "10px 12px", borderRadius: "8px", border: `1px solid ${borderCard}`, background: bgCard, color: colorMain, fontSize: "14px" }} />
          </div>

          <div style={{ display: "flex", gap: "10px", justifyContent: "center", marginBottom: "24px", flexWrap: "wrap" }}>
            <button onClick={handleStartPause} style={{ background: "#38BDF8", color: "#0B0F19", borderRadius: "8px", padding: "10px 20px", border: "none", fontWeight: 600, cursor: "pointer", fontSize: "14px" }}>
              {isRunning ? "Duraklat" : "Başla"}
            </button>
            <button onClick={handleFinish} style={{ background: "#2DD4BF", color: "#0B0F19", borderRadius: "8px", padding: "10px 20px", border: "none", fontWeight: 600, cursor: "pointer", fontSize: "14px" }}>
              Bitir ve Kaydet
            </button>
            <button onClick={handleReset} style={{ background: bgCard, color: colorMain, border: `1px solid ${borderCard}`, borderRadius: "8px", padding: "10px 14px", cursor: "pointer", fontSize: "14px" }}>
              Sıfırla
            </button>
          </div>

          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "12px", marginBottom: "24px" }}>
            <div style={{ background: bgCard, border: `1px solid ${borderCard}`, borderRadius: "12px", padding: "14px" }}>
              <p style={{ fontSize: "12px", color: textMuted, margin: "0 0 4px" }}>Bugün çalışma</p>
              <p style={{ fontSize: "20px", fontWeight: 600, margin: 0 }}>{formatMinutes(todayMinutes)}</p>
            </div>
            <div style={{ background: bgCard, border: `1px solid ${borderCard}`, borderRadius: "12px", padding: "14px" }}>
              <p style={{ fontSize: "12px", color: textMuted, margin: "0 0 4px" }}>Bugün mola</p>
              <p style={{ fontSize: "20px", fontWeight: 600, margin: 0 }}>{formatMinutes(todayBreakMinutes)}</p>
            </div>
            <div style={{ background: bgCard, border: `1px solid ${borderCard}`, borderRadius: "12px", padding: "14px", gridColumn: "span 2" }}>
              <p style={{ fontSize: "12px", color: textMuted, margin: "0 0 4px" }}>Bu hafta çalışma</p>
              <p style={{ fontSize: "20px", fontWeight: 600, margin: 0 }}>{formatMinutes(weekMinutes)}</p>
            </div>
          </div>

          {/* Haftalık Çalışma Çizelgesi */}
          <div style={{ background: bgCard, border: `1px solid ${borderCard}`, borderRadius: "12px", padding: "16px", marginBottom: "24px" }}>
            <p style={{ fontSize: "13px", color: textMuted, margin: "0 0 12px" }}>Haftalık çalışma (dakika)</p>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: "6px", textAlign: "center" }}>
              {weekData.map((d, i) => (
                <div key={i} style={{ background: bgInner, border: `1px solid ${borderCard}`, borderRadius: "8px", padding: "8px 2px" }}>
                  <p style={{ fontSize: "10px", color: textMuted, margin: "0 0 4px" }}>{d.label}</p>
                  <p style={{ fontSize: "12px", fontWeight: 600, margin: 0 }}>{d.dakika}d</p>
                </div>
              ))}
            </div>
          </div>

          <div style={{ background: bgCard, border: `1px solid ${borderCard}`, borderRadius: "12px", padding: "16px" }}>
            <p style={{ fontSize: "13px", color: textMuted, margin: "0 0 12px" }}>Geçmiş oturumlar</p>
            {sessions.length === 0 && <p style={{ fontSize: "13px", color: textMuted, margin: 0 }}>Henüz kayıt yok.</p>}
            <div style={{ display: "flex", flexDirection: "column", gap: "6px", maxHeight: "220px", overflowY: "auto" }}>
              {sessions.map((s) => (
                <div key={s.id} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", fontSize: "13px", padding: "8px 12px", background: bgInner, border: `1px solid ${borderCard}`, borderRadius: "8px" }}>
                  <span>{s.subject} — {s.date} — {formatMinutes(s.minutes)}</span>
                  <button onClick={() => deleteSession(s.id)} style={{ background: "transparent", color: "#F43F5E", border: "none", cursor: "pointer" }}>Sil</button>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<StudyTracker />);
  </script>
</body>
</html>
