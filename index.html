<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0B0F19">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Ders Çalışma Takip - ÖSYM Pro</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100vh;
      font-family: 'Inter', sans-serif;
      touch-action: manipulation;
      -webkit-text-size-adjust: 100%;
    }
    @keyframes pulseAlert {
      0% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.02); }
      100% { opacity: 1; transform: scale(1); }
    }
    .exam-danger {
      animation: pulseAlert 1s infinite;
    }
    @keyframes floatTree {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
      100% { transform: translateY(0px); }
    }
    .tree-animate {
      animation: floatTree 3s ease-in-out infinite;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo, useCallback } = React;

    const DAYS = ["Pzt", "Sal", "Çar", "Per", "Cum", "Cmt", "Paz"];
    
    const MOTIVATIONS = [
      "Bugün döktüğün her damla alın teri, yarınki zaferinin temelidir.",
      "Vazgeçmek üzere olduğunda, ne kadar ileri geldiğini hatırla.",
      "ÖSYM salonunda yüzünü güldürecek olan bugünkü disiplindir.",
      "Küçük adımlar büyük başarıları doğurur. Masadan kalkma!",
      "Zorluklar başarının değerini artıran en büyük unsurlardır.",
      "Bugün çalışmadığın her saat, rakibinin öne geçtiği saattir."
    ];

    const KPSS_TOPICS_DEFAULT = {
      "Türkçe": [
        "Sözcükte Anlam", "Cümlede Anlam", "Paragraf ve Anlatım Biçimleri", "Ses Bilgisi", 
        "Yazım Kuralları", "Noktalama İşaretleri", "Sözcük Yapısı / Ekler", "İsimler", 
        "Sıfatlar", "Zamirler", "Zarflar", "Edat - Bağlaç - Ünlem", "Fiiller ve Fiilimsiler", 
        "Cümlenin Ögeleri", "Cümle Çeşitleri", "Anlatım Bozuklukları"
      ],
      "Matematik": [
        "Temel Kavramlar", "Sayı Basamakları", "Bölme ve Bölünebilme", "Aslak Çarpanlar / EBOB-EKOK", 
        "Rasyonel Sayılar", "Ondalık Sayılar", "Basit Eşitsizlikler", "Mutlak Değer", 
        "Üslü Sayılar", "Köklü Sayılar", "Çarpanlara Ayırma", "Oran ve Orantı", 
        "Denklem Çözme", "Problemler (Sayı, Kesir, Yaş)", "Problemler (İşçi, Havuz, Yüzde)", 
        "Problemler (Kar-Zarar, Faiz, Karışım)", "Kümeler", "Fonksiyonlar", "İşlem ve Modüler Aritmetik", 
        "Olasılık", "Permütasyon - Kombinasyon", "İstatistik"
      ],
      "Tarih": [
        "İslamiyet Öncesi Türk Tarihi", "İlk Türk - İslam Devletleri", "Osmanlı Devleti Siyasi Tarih", 
        "Osmanlı Kültür ve Medeniyeti", "XIX. Yüzyılda Osmanlı Devleti", "XX. Yüzyılda Osmanlı Devleti", 
        "I. Dünya Savaşı ve Sonrası Gelişmeler", "Milli Mücadele Hazırlık Dönemi", 
        "Kurtuluş Savaşı Suriye/Doğu/Güney Cepheleri", "I. TBMM Dönemi ve Ayaklanmalar", 
        "Kurtuluş Savaşı Muharebeler Dönemi ve Lozan", "Atatürk İlkeleri ve İnkılapları", 
        "Atatürk Dönemi Türk Dış Politikası", "Çağdaş Türk ve Dünya Tarihi"
      ],
      "Coğrafya": [
        "Türkiye'nin Coğrafi Konumu", "Türkiye'nin Yer Şekilleri ve Dağları", "Türkiye'nin İklimi ve Bitki Örtüsü", 
        "Türkiye'nin Su Varlığı (Akarsular, Göller)", "Türkiye'de Toprak Tipleri ve Erozyon", 
        "Türkiye'de Nüfus ve Yerleşme", "Türkiye'de Tarım ve Hayvancılık", "Türkiye'de Madenler ve Enerji Kaynakları", 
        "Türkiye'de Sanayi ve Ulaşım", "Türkiye'nin Ticareti ve Turizmi", "Bölgesel Coğrafya ve Kalkınma Projeleri"
      ],
      "Vatandaşlık": [
        "Hukukun Temel Kavramları", "Devlet Biçimleri ve Demokrasi", "1982 Anayasası'nın Temel İlkeleri", 
        "Yasama (TBMM)", "Yürürlük (Cumhurbaşkanı ve Bakanlar)", "Yargı (Yüksek Mahkemeler)", 
        "İdare Hukuku ve Mahalli İdareler"
      ],
      "Eğitim Bilimleri": [
        "Eğitim Psikolojisi / Gelişim", "Öğrenme Psikolojisi", "Rehberlik ve Özel Eğitim", 
        "Öğretim İlke ve Yöntemleri", "Sınıf Yönetimi", "Ölçme ve Değerlendirme", "Program Geliştirme"
      ]
    };

    const DEFAULT_SUBJECTS = Object.keys(KPSS_TOPICS_DEFAULT);

    function pad(n) { return String(n).padStart(2, "0"); }
    function formatClock(totalSeconds) {
      const h = Math.floor(totalSeconds / 3600);
      const m = Math.floor((totalSeconds % 3600) / 60);
      const s = totalSeconds % 60;
      return h > 0 ? `${pad(h)}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`;
    }
    function formatMinutes(mins) {
      const h = Math.floor(mins / 60);
      const m = Math.round(mins % 60);
      if (h === 0) return `${m} dk`;
      return `${h} sa ${m} dk`;
    }
    function isoDay(date) { return date.toISOString().slice(0, 10); }
    function mondayIndex(date) { return (date.getDay() + 6) % 7; }

    function StudyTracker() {
      const [loaded, setLoaded] = useState(false);
      const [theme, setTheme] = useState("dark");
      const [sessions, setSessions] = useState([]);
      const [exams, setExams] = useState([]);
      const [topics, setTopics] = useState({});
      const [topicMinutes, setTopicMinutes] = useState({});
      const [dailyNotes, setDailyNotes] = useState({});
      const [wrongNotes, setWrongNotes] = useState([]);
      const [flashcards, setFlashcards] = useState([]);
      const [forestCount, setForestCount] = useState(0);
      
      const [activeTab, setActiveTab] = useState("sayac");
      const [sayacFolder, setSayacFolder] = useState("kronometre");
      const [filterDate, setFilterDate] = useState("");
      const [menuOpen, setMenuOpen] = useState(false);
      const [currentQuoteIndex, setCurrentQuoteIndex] = useState(0);

      const [fcFront, setFcFront] = useState("");
      const [fcBack, setFcBack] = useState("");
      const [flippedCardId, setFlippedCardId] = useState(null);

      const [subject, setSubject] = useState("");
      const [isRunning, setIsRunning] = useState(false);
      const [elapsed, setElapsed] = useState(0);
      const startTimeRef = useRef(null);
      const accumulatedTimeRef = useRef(0);
      const tickRef = useRef(null);

      const [pomoMinutes, setPomoMinutes] = useState(25);
      const [pomoSecondsLeft, setPomoSecondsLeft] = useState(25 * 60);
      const [isPomoRunning, setIsPomoRunning] = useState(false);
      const [pomoSubject, setPomoSubject] = useState("");
      const pomoEndTimeRef = useRef(null);
      const pomoRemainingAtPauseRef = useRef(25 * 60);
      const pomoTickRef = useRef(null);

      const [pIsRunning, setPIsRunning] = useState(false);
      const [pElapsed, setPElapsed] = useState(0);
      const [pCount, setPCount] = useState(0);
      const pStartTimeRef = useRef(null);
      const pAccumulatedTimeRef = useRef(0);
      const pTickRef = useRef(null);

      const [examDurationMins, setExamDurationMins] = useState(135);
      const [examSecondsLeft, setExamSecondsLeft] = useState(135 * 60);
      const [isExamRunning, setIsExamRunning] = useState(false);
      const [examTimerName, setExamTimerName] = useState("");
      const examEndTimeRef = useRef(null);
      const examRemainingAtPauseRef = useRef(135 * 60);
      const examTickRef = useRef(null);

      const [kpssDaysLeft, setKpssDaysLeft] = useState(0);

      useEffect(() => {
        const targetDate = new Date("2026-10-04T10:15:00");
        const updateKpssTimer = () => {
          const now = new Date();
          const diff = targetDate - now;
          if (diff > 0) {
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            setKpssDaysLeft(days);
          } else {
            setKpssDaysLeft(0);
          }
        };
        updateKpssTimer();
        setCurrentQuoteIndex(Math.floor(Math.random() * MOTIVATIONS.length));
      }, []);

      const [targetStudyMins, setTargetStudyMins] = useState(180);
      const [targetParagraphs, setTargetParagraphs] = useState(50);

      const [activeTopicSubj, setActiveTopicSubj] = useState("Türkçe");
      const [newTopicName, setNewTopicName] = useState("");
      const [examName, setExamName] = useState("");
      const [examNetTr, setExamNetTr] = useState("");
      const [examNetMat, setExamNetMat] = useState("");
      const [examNetSos, setExamNetSos] = useState("");
      const [examNetFen, setExamNetFen] = useState("");

      const [currentNoteText, setCurrentNoteText] = useState("");
      const [newWrongText, setNewWrongText] = useState("");

      useEffect(() => {
        try {
          const t = localStorage.getItem("study-theme");
          if (t) setTheme(t);
        } catch (e) {}
        try {
          const s = localStorage.getItem("study-sessions-v8");
          if (s) setSessions(JSON.parse(s));
        } catch (e) {}
        try {
          const e = localStorage.getItem("study-exams-v1");
          if (e) setExams(JSON.parse(e));
        } catch (e) {}
        try {
          const tm = localStorage.getItem("study-topic-mins-v1");
          if (tm) setTopicMinutes(JSON.parse(tm));
        } catch (e) {}
        try {
          const dn = localStorage.getItem("study-daily-notes-v1");
          if (dn) setDailyNotes(JSON.parse(dn));
        } catch (e) {}
        try {
          const wn = localStorage.getItem("study-wrong-notes-v1");
          if (wn) setWrongNotes(JSON.parse(wn));
        } catch (e) {}
        try {
          const fc = localStorage.getItem("study-flashcards-v1");
          if (fc) setFlashcards(JSON.parse(fc));
        } catch (e) {}
        try {
          const fcCount = localStorage.getItem("study-forest-count-v1");
          if (fcCount) setForestCount(Number(fcCount));
        } catch (e) {}
        try {
          const tp = localStorage.getItem("study-topics-v3");
          if (tp) {
            setTopics(JSON.parse(tp));
          } else {
            const initialMap = {};
            DEFAULT_SUBJECTS.forEach(sub => {
              initialMap[sub] = KPSS_TOPICS_DEFAULT[sub].map((tName, idx) => ({
                id: "t_" + sub + "_" + idx,
                name: tName,
                completed: false
              }));
            });
            setTopics(initialMap);
            localStorage.setItem("study-topics-v3", JSON.stringify(initialMap));
          }
        } catch (e) {}
        try {
          const ts = localStorage.getItem("study-target-mins-v2");
          if (ts) setTargetStudyMins(Number(ts));
        } catch (e) {}
        try {
          const tpTarget = localStorage.getItem("study-target-p-v2");
          if (tpTarget) setTargetParagraphs(Number(tpTarget));
        } catch (e) {}
        setLoaded(true);
      }, []);

      const today = isoDay(new Date());

      useEffect(() => {
        if (dailyNotes[today] !== undefined) {
          setCurrentNoteText(dailyNotes[today] || "");
        }
      }, [dailyNotes, today]);

      useEffect(() => {
        if (subject.trim()) {
          const matched = DEFAULT_SUBJECTS.find(s => subject.toLowerCase().includes(s.toLowerCase()));
          if (matched) setActiveTopicSubj(matched);
        }
      }, [subject]);

      let bgMain = "#090D16", colorMain = "#F1F5F9", bgCard = "#111827", borderCard = "#1F2937", textMuted = "#9CA3AF", bgInner = "#0D1322";
      if (theme === "oled") {
        bgMain = "#000000"; colorMain = "#FFFFFF"; bgCard = "#080808"; borderCard = "#1C1C1C"; textMuted = "#A3A3A3"; bgInner = "#000000";
      } else if (theme === "light") {
        bgMain = "#F4F6F9"; colorMain = "#0F172A"; bgCard = "#FFFFFF"; borderCard = "#E2E8F0"; textMuted = "#64748B"; bgInner = "#F8FAFC";
      }

      useEffect(() => {
        const metaThemeColor = document.querySelector('meta[name="theme-color"]');
        if (metaThemeColor) metaThemeColor.setAttribute("content", bgMain);
        document.body.style.backgroundColor = bgMain;
      }, [bgMain]);

      const cycleTheme = () => {
        let next = "dark";
        if (theme === "dark") next = "oled";
        else if (theme === "oled") next = "light";
        else next = "dark";
        setTheme(next);
        try { localStorage.setItem("study-theme", next); } catch (e) {}
        setMenuOpen(false);
      };

      const saveSessions = useCallback((next) => {
        setSessions(next);
        try { localStorage.setItem("study-sessions-v8", JSON.stringify(next)); } catch (e) {}
      }, []);

      const saveExams = useCallback((next) => {
        setExams(next);
        try { localStorage.setItem("study-exams-v1", JSON.stringify(next)); } catch (e) {}
      }, []);

      const saveTopics = useCallback((next) => {
        setTopics(next);
        try { localStorage.setItem("study-topics-v3", JSON.stringify(next)); } catch (e) {}
      }, []);

      const saveTopicMinutes = useCallback((next) => {
        setTopicMinutes(next);
        try { localStorage.setItem("study-topic-mins-v1", JSON.stringify(next)); } catch (e) {}
      }, []);

      const handleSaveNote = () => {
        const nextNotes = { ...dailyNotes, [today]: currentNoteText };
        setDailyNotes(nextNotes);
        try { localStorage.setItem("study-daily-notes-v1", JSON.stringify(nextNotes)); } catch (e) {}
        alert("Günlük not kaydedildi!");
      };

      const handleAddWrongNote = (e) => {
        e.preventDefault();
        if (!newWrongText.trim()) return;
        const item = { id: Date.now(), text: newWrongText.trim(), subject: activeTopicSubj };
        const nextList = [item, ...wrongNotes];
        setWrongNotes(nextList);
        try { localStorage.setItem("study-wrong-notes-v1", JSON.stringify(nextList)); } catch (e) {}
        setNewWrongText("");
      };

      const deleteWrongNote = (id) => {
        const nextList = wrongNotes.filter(w => w.id !== id);
        setWrongNotes(nextList);
        try { localStorage.setItem("study-wrong-notes-v1", JSON.stringify(nextList)); } catch (e) {}
      };

      const handleAddFlashcard = (e) => {
        e.preventDefault();
        if (!fcFront.trim() || !fcBack.trim()) return;
        const card = { id: Date.now(), front: fcFront.trim(), back: fcBack.trim() };
        const nextList = [card, ...flashcards];
        setFlashcards(nextList);
        try { localStorage.setItem("study-flashcards-v1", JSON.stringify(nextList)); } catch (e) {}
        setFcFront("");
        setFcBack("");
      };

      const deleteFlashcard = (id) => {
        const nextList = flashcards.filter(c => c.id !== id);
        setFlashcards(nextList);
        try { localStorage.setItem("study-flashcards-v1", JSON.stringify(nextList)); } catch (e) {}
      };

      const updateTopicMinutesValue = (topicKey, value) => {
        const mins = Math.max(0, Number(value) || 0);
        const nextMap = { ...topicMinutes, [topicKey]: mins };
        saveTopicMinutes(nextMap);
      };

      const updateTargetMins = (val) => {
        const v = Math.max(10, val);
        setTargetStudyMins(v);
        try { localStorage.setItem("study-target-mins-v2", String(v)); } catch (e) {}
      };

      const updateTargetParagraphs = (val) => {
        const v = Math.max(5, val);
        setTargetParagraphs(v);
        try { localStorage.setItem("study-target-p-v2", String(v)); } catch (e) {}
      };

      useEffect(() => {
        if (isRunning) {
          startTimeRef.current = Date.now();
          tickRef.current = setInterval(() => {
            const now = Date.now();
            const diffSecs = Math.floor((now - startTimeRef.current) / 1000);
            setElapsed(accumulatedTimeRef.current + diffSecs);
          }, 200);
        } else {
          if (tickRef.current) clearInterval(tickRef.current);
          accumulatedTimeRef.current = elapsed;
        }
        return () => { if (tickRef.current) clearInterval(tickRef.current); };
      }, [isRunning]);

      useEffect(() => {
        if (isPomoRunning) {
          pomoEndTimeRef.current = Date.now() + (pomoRemainingAtPauseRef.current * 1000);
          pomoTickRef.current = setInterval(() => {
            const now = Date.now();
            const leftSecs = Math.ceil((pomoEndTimeRef.current - now) / 1000);
            if (leftSecs <= 0) {
              setIsPomoRunning(false);
              setPomoSecondsLeft(0);
              pomoRemainingAtPauseRef.current = 0;
              const newForest = forestCount + 1;
              setForestCount(newForest);
              try { localStorage.setItem("study-forest-count-v1", String(newForest)); } catch (e) {}
              alert("🎉 Pomodoro bitti! Ormanına 1 yeni odak ağacı eklendi!");
            } else {
              setPomoSecondsLeft(leftSecs);
            }
          }, 200);
        } else {
          if (pomoTickRef.current) clearInterval(pomoTickRef.current);
          pomoRemainingAtPauseRef.current = pomoSecondsLeft;
        }
        return () => { if (pomoTickRef.current) clearInterval(pomoTickRef.current); };
      }, [isPomoRunning, forestCount]);

      useEffect(() => {
        if (pIsRunning) {
          pStartTimeRef.current = Date.now();
          pTickRef.current = setInterval(() => {
            const now = Date.now();
            const diffSecs = Math.floor((now - pStartTimeRef.current) / 1000);
            setPElapsed(pAccumulatedTimeRef.current + diffSecs);
          }, 200);
        } else {
          if (pTickRef.current) clearInterval(pTickRef.current);
          pAccumulatedTimeRef.current = pElapsed;
        }
        return () => { if (pTickRef.current) clearInterval(pTickRef.current); };
      }, [pIsRunning]);

      useEffect(() => {
        if (isExamRunning) {
          examEndTimeRef.current = Date.now() + (examRemainingAtPauseRef.current * 1000);
          examTickRef.current = setInterval(() => {
            const now = Date.now();
            const leftSecs = Math.ceil((examEndTimeRef.current - now) / 1000);
            if (leftSecs <= 0) {
              setIsExamRunning(false);
              setExamSecondsLeft(0);
              examRemainingAtPauseRef.current = 0;
              alert("SÜRE BİTTİ! ÖSYM sınav salonu kapandı!");
            } else {
              setExamSecondsLeft(leftSecs);
            }
          }, 200);
        } else {
          if (examTickRef.current) clearInterval(examTickRef.current);
          examRemainingAtPauseRef.current = examSecondsLeft;
        }
        return () => { if (examTickRef.current) clearInterval(examTickRef.current); };
      }, [isExamRunning]);

      const selectExamDuration = (mins) => {
        setIsExamRunning(false);
        setExamDurationMins(mins);
        setExamSecondsLeft(mins * 60);
        examRemainingAtPauseRef.current = mins * 60;
      };

      const handleStartPause = () => {
        if (!isRunning && !subject.trim()) return;
        setIsRunning((r) => !r);
      };

      const handleFinish = () => {
        if (elapsed < 3) {
          setIsRunning(false); setElapsed(0); accumulatedTimeRef.current = 0; return;
        }
        const minutes = Math.max(1, Math.round(elapsed / 60));
        const session = { id: Date.now(), type: "ders", subject: subject.trim() || "Genel", minutes, seconds: elapsed, date: isoDay(new Date()) };
        saveSessions([session, ...sessions]);
        if (minutes >= 25) {
          const newForest = forestCount + 1;
          setForestCount(newForest);
          try { localStorage.setItem("study-forest-count-v1", String(newForest)); } catch (e) {}
        }
        setIsRunning(false); setElapsed(0); accumulatedTimeRef.current = 0;
      };

      const handleReset = () => { setIsRunning(false); setElapsed(0); accumulatedTimeRef.current = 0; };

      const selectPomoTime = (mins) => {
        setIsPomoRunning(false); setPomoMinutes(mins); setPomoSecondsLeft(mins * 60); pomoRemainingAtPauseRef.current = mins * 60;
      };

      const handlePomoFinish = () => {
        const elapsedSecs = (pomoMinutes * 60) - pomoSecondsLeft;
        if (elapsedSecs < 10) {
          setIsPomoRunning(false); setPomoSecondsLeft(pomoMinutes * 60); pomoRemainingAtPauseRef.current = pomoMinutes * 60; return;
        }
        const minutes = Math.max(1, Math.round(elapsedSecs / 60));
        const session = { id: Date.now(), type: "ders", subject: pomoSubject.trim() || "Pomodoro Çalışması", minutes, seconds: elapsedSecs, date: isoDay(new Date()) };
        saveSessions([session, ...sessions]);
        const newForest = forestCount + 1;
        setForestCount(newForest);
        try { localStorage.setItem("study-forest-count-v1", String(newForest)); } catch (e) {}
        setIsPomoRunning(false); setPomoSecondsLeft(pomoMinutes * 60); pomoRemainingAtPauseRef.current = pomoMinutes * 60;
      };

      const handlePStartPause = () => setPIsRunning((r) => !r);

      const handlePFinish = () => {
        if (pElapsed < 3 && pCount === 0) {
          setPIsRunning(false); setPElapsed(0); pAccumulatedTimeRef.current = 0; setPCount(0); return;
        }
        const minutes = Math.max(1, Math.round(pElapsed / 60));
        const log = { id: Date.now(), type: "paragraf", subject: "Paragraf / Soru", minutes, count: pCount, seconds: pElapsed, date: isoDay(new Date()) };
        saveSessions([log, ...sessions]);
        setPIsRunning(false); setPElapsed(0); pAccumulatedTimeRef.current = 0; setPCount(0);
      };

      const handlePReset = () => { setPIsRunning(false); setPElapsed(0); pAccumulatedTimeRef.current = 0; setPCount(0); };

      const deleteSession = (id) => saveSessions(sessions.filter((s) => s.id !== id));
      const deleteExam = (id) => saveExams(exams.filter((e) => e.id !== id));

      const handleAddTopic = (e) => {
        e.preventDefault();
        if (!newTopicName.trim()) return;
        const list = topics[activeTopicSubj] || [];
        const nextList = [...list, { id: "custom_" + Date.now(), name: newTopicName.trim(), completed: false }];
        saveTopics({ ...topics, [activeTopicSubj]: nextList });
        setNewTopicName("");
      };

      const toggleTopic = (subj, id) => {
        const list = topics[subj] || [];
        const nextList = list.map(t => t.id === id ? { ...t, completed: !t.completed } : t);
        saveTopics({ ...topics, [subj]: nextList });
      };

      const deleteTopic = (subj, id) => {
        const list = topics[subj] || [];
        saveTopics({ ...topics, [subj]: list.filter(t => t.id !== id) });
      };

      const handleAddExam = (e) => {

        const exam = {
          id: Date.now(),
          name: examName.trim(),
          tr: Number(examNetTr) || 0,
          mat: Number(examNetMat) || 0,
          sos: Number(examNetSos) || 0,
          fen: Number(examNetFen) || 0,
          total: (Number(examNetTr) || 0) + (Number(examNetMat) || 0) + (Number(examNetSos) || 0) + (Number(examNetFen) || 0),
          date: isoDay(new Date())
        };
        saveExams([exam, ...exams]);
        setExamName(""); setExamNetTr(""); setExamNetMat(""); setExamNetSos(""); setExamNetFen("");

      const exportData = () => {
        const data = { sessions, exams, topics, topicMinutes, targetStudyMins, targetParagraphs, dailyNotes, wrongNotes, flashcards, forestCount };

        setMenuOpen(false);
      };

      const importData = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const data = JSON.parse(event.target.result);
            if (data.sessions) saveSessions(data.sessions);
            if (data.exams) saveExams(data.exams);
            if (data.topics) saveTopics(data.topics);
            if (data.topicMinutes) saveTopicMinutes(data.topicMinutes);
            if (data.dailyNotes) setDailyNotes(data.dailyNotes);
            if (data.wrongNotes) setWrongNotes(data.wrongNotes);
            if (data.flashcards) setFlashcards(data.flashcards);
            if (data.forestCount !== undefined) setForestCount(data.forestCount);
            if (data.targetStudyMins) updateTargetMins(data.targetStudyMins);
            if (data.targetParagraphs) updateTargetParagraphs(data.targetParagraphs);
            alert("Yedek başarıyla yüklendi!");
          } catch (err) { alert("Geçersiz yedek dosyası!"); }
        };
        reader.readAsText(file);
        setMenuOpen(false);
      };

      const todaySessions = sessions.filter((s) => s.date === today);
      const todayMinutes = todaySessions.filter(s => s.type !== "paragraf").reduce((a, s) => a + s.minutes, 0);
      const todayParagraphMinutes = todaySessions.filter(s => s.type === "paragraf").reduce((a, s) => a + s.minutes, 0);
      const todayParagraphCount = todaySessions.filter(s => s.type === "paragraf").reduce((a, s) => a + (s.count || 0), 0);

      const totalXp = useMemo(() => {
        const totalMin = sessions.reduce((acc, s) => acc + (s.minutes || 0), 0);
        const totalP = sessions.reduce((acc, s) => acc + (s.count || 0), 0);
        return (totalMin * 10) + (totalP * 5) + (forestCount * 50);
      }, [sessions, forestCount]);

      const currentLevel = Math.floor(totalXp / 1000) + 1;
      const xpProgress = totalXp % 1000;

      const streakCount = useMemo(() => {
        if (!sessions || sessions.length === 0) return 0;
        let streak = 0;
        const dateObj = new Date();
        for (let i = 0; i < 60; i++) {
          const dStr = isoDay(dateObj);
          const hasStudied = sessions.some(s => s && s.date === dStr && (Number(s.minutes) || 0) > 0);
          if (hasStudied) { streak++; } else if (i > 0) { break; }
          dateObj.setDate(dateObj.getDate() - 1);
        }
        return streak;
      }, [sessions]);

      const filteredSessions = useMemo(() => {
        if (!filterDate) return sessions;
        return sessions.filter(s => s.date === filterDate);
      }, [sessions, filterDate]);

      const weekData = useMemo(() => {
        try {
          const now = new Date();
          const monday = new Date(now);
          monday.setDate(now.getDate() - mondayIndex(now));
          const days = [];
          for (let i = 0; i < 7; i++) {
            const d = new Date(monday);
            d.setDate(monday.getDate() + i);
            const dISO = isoDay(d);
            const mins = sessions.filter((s) => s && s.date === dISO && s.type !== "paragraf").reduce((a, s) => a + (Number(s.minutes) || 0), 0);
            days.push({ label: DAYS[i], dakika: mins });
          }
          return days;
        } catch (err) { return DAYS.map(d => ({ label: d, dakika: 0 })); }
      }, [sessions]);

      const weekMinutes = weekData.reduce((a, d) => a + d.dakika, 0);
      const maxWeekMin = Math.max(1, ...weekData.map(d => d.dakika));

      const subjectDistribution = useMemo(() => {
        try {
          const map = {};
          sessions.filter(s => s && s.type !== "paragraf").forEach(s => {
            const subjName = s.subject || "Genel";
            map[subjName] = (map[subjName] || 0) + (Number(s.minutes) || 0);

          return Object.entries(map).sort((a, b) => b[1] - a[1]);
        } catch (err) { return []; }

      const activeSubjectTotalMins = useMemo(() => {

          totalTr += (ex.tr || 0); totalMat += (ex.mat || 0); totalSos += (ex.sos || 0); totalFen += (ex.fen || 0);

          { name: "Türkçe", val: totalTr / recentExams.length },
          { name: "Matematik", val: totalMat / recentExams.length },
          { name: "Sosyal / Tarih", val: totalSos / recentExams.length },
          { name: "Fen / Vatandaşlık", val: totalFen / recentExams.length }

        avgs.sort((a, b) => a.val - b.val);
        return `Son denemelere göre öncelik vermen gereken ders: ${avgs[0].name} (Ort. Net: ${avgs[0].val.toFixed(1)})`;
      }, [exams]);

                    <span style={{ color: textMuted, fontWeight: 700 }}>%{Math.min(100, Math.round((todayParagraphCount / targetParagraphs) * 100))}</span>

                  <div style={{ margin: "14px 0", fontSize: "44px", fontWeight: 800, fontFamily: "monospace", letterSpacing: "-1px" }}>{formatClock(elapsed)}</div>
                  <div style={{ display: "flex", gap: "8px", justifyContent: "center", marginBottom: "16px" }}>

                  <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: "6px", marginBottom: "4px" }}>

                    <input placeholder="Pomodoro Dersi..." value={pomoSubject} onChange={(e) => setPomoSubject(e.target.value)} disabled={isPomoRunning} style={{ width: "100%", maxWidth: "320px", padding: "12px 16px", borderRadius: "12px", border: `1px solid ${borderCard}`, background: bgInner, color: colorMain, fontSize: "14px", fontWeight: 600 }} />

            <button onClick={() => setActiveTab("denemeler")} style={{ background: activeTab === "denemeler" ? "#38BDF8" : "transparent", color: activeTab === "denemeler" ? "#090D16" : colorMain, border: "none", borderRadius: "12px", padding: "8px 12px", fontWeight: 800, cursor: "pointer", fontSize: "12px", flex: 1, textAlign: "center" }}>📈 Deneme</button>

    }
