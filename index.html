  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow-x: hidden;
      font-family: 'Inter', sans-serif;
      touch-action: manipulation;
      -webkit-text-size-adjust: 100%;
    }
    @keyframes pulseAlert {
      0% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.02); }
      100% { opacity: 1; transform: scale(1); }
    }
    .exam-danger { animation: pulseAlert 1s infinite; }
    @keyframes floatTree {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
      100% { transform: translateY(0px); }
    }
    .tree-animate { animation: floatTree 3s ease-in-out infinite; }
    @keyframes softGlow {
      0% { box-shadow: 0 0 15px rgba(244, 63, 94, 0.2); }
      50% { box-shadow: 0 0 30px rgba(244, 63, 94, 0.4); }
      100% { box-shadow: 0 0 15px rgba(244, 63, 94, 0.2); }
    }
    .love-card-glow { animation: softGlow 4s infinite; }
    
    @keyframes floatHeart {
      0% { transform: translateY(0px) scale(0.8); opacity: 0.25; }
      50% { transform: translateY(-7px) scale(1.1); opacity: 0.65; }
      100% { transform: translateY(0px) scale(0.8); opacity: 0.25; }
    }
    .heart-float-1 { animation: floatHeart 3s ease-in-out infinite; }
    .heart-float-2 { animation: floatHeart 4s ease-in-out infinite 1s; }
    .heart-float-3 { animation: floatHeart 3.5s ease-in-out infinite 0.5s; }
    .heart-float-4 { animation: floatHeart 4.5s ease-in-out infinite 1.5s; }
    .heart-float-5 { animation: floatHeart 3.2s ease-in-out infinite 0.8s; }

    @keyframes confettiFall {
      0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
      100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
    }
    .confetti {
      position: fixed;
      top: -10px;
      width: 10px;
      height: 10px;
      background-color: #F43F5E;
      animation: confettiFall 2.5s ease-in-out forwards;
      z-index: 999999;
      pointer-events: none;
    }

    input, textarea, button, select { font-family: 'Inter', sans-serif; }
    input:focus, textarea:focus, select:focus { outline: none; border-color: #38BDF8 !important; box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15); }
    button { transition: transform 0.1s ease, opacity 0.2s ease; }
    button:active { transform: scale(0.97); }
  </style>
</head>

    const KPSS_ROTATING_BLOCKS = [

    function pad(n) { return String(n).padStart(2, "0"); }
    function formatClock(totalSeconds) {
      const h = Math.floor(totalSeconds / 3600);
      const m = Math.floor((totalSeconds % 3600) / 60);
      const s = totalSeconds % 60;
      return h > 0 ? `${pad(h)}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`;
    }
    function formatMinutes(mins) {
      const h = Math.floor(mins / 60);
      const m = Math.round(mins % 60);
      if (h === 0) return `${m} dk`;
      return `${h} sa ${m} dk`;
    }
    function isoDay(date) { return date.toISOString().slice(0, 10); }
    function mondayIndex(date) { return (date.getDay() + 6) % 7; }

    function triggerConfetti() {
      for (let i = 0; i < 35; i++) {
        const c = document.createElement("div");
        c.className = "confetti";
        c.style.left = Math.random() * 100 + "vw";
        c.style.backgroundColor = ["#38BDF8", "#2DD4BF", "#F43F5E", "#F59E0B", "#EC4899"][Math.floor(Math.random() * 5)];
        c.style.animationDuration = (Math.random() * 1.5 + 1.5) + "s";
        c.style.animationDelay = (Math.random() * 0.3) + "s";
        document.body.appendChild(c);
        setTimeout(() => c.remove(), 3000);
      }
    }

    function StudyTracker() {
      const [loaded, setLoaded] = useState(false);
      const [theme, setTheme] = useState("dark");
      const [sessions, setSessions] = useState([]);
      const [exams, setExams] = useState([]);
      const [topics, setTopics] = useState({});
      const [topicMinutes, setTopicMinutes] = useState({});
      const [dailyNotes, setDailyNotes] = useState({});
      const [wrongNotes, setWrongNotes] = useState([]);
      const [flashcards, setFlashcards] = useState([]);
      const [forestCount, setForestCount] = useState(0);
      const [kpssArchive, setKpssArchive] = useState({});
      
      const [favoriteCompliments, setFavoriteCompliments] = useState([]);
      const [adminLoveNote, setAdminLoveNote] = useState("Bugün de masada harikalar yaratıyorsun sevgilim, seninle gurur duyuyorum! 💖");
      const [isNoteOpened, setIsNoteOpened] = useState(false);
      
      const [activeTab, setActiveTab] = useState("sayac");
      const [sayacFolder, setSayacFolder] = useState("kronometre");
      const [filterDate, setFilterDate] = useState("");
      const [settingsModalOpen, setSettingsModalOpen] = useState(false);
      const [currentQuoteIndex, setCurrentQuoteIndex] = useState(0);
      const [currentLoveText, setCurrentLoveText] = useState("");

      const [quizIndex, setQuizIndex] = useState(0);
      const [selectedQuizOpt, setSelectedQuizOpt] = useState(null);
      const [quizScore, setQuizScore] = useState(0);

      const [blockIndex, setBlockIndex] = useState(0);
      const [blockSecondsLeft, setBlockSecondsLeft] = useState(7200);

      useEffect(() => {
        const updateBlockAndTimer = () => {
          const now = new Date();
          const totalSecsToday = (now.getHours() * 3600) + (now.getMinutes() * 60) + now.getSeconds();
          const currentBlock = Math.floor((totalSecsToday % 21600) / 7200);
          setBlockIndex(currentBlock % KPSS_ROTATING_BLOCKS.length);
          
          const secsIntoCurrentBlock = totalSecsToday % 7200;
          setBlockSecondsLeft(7200 - secsIntoCurrentBlock);
        };

        updateBlockAndTimer();
        const timerInterval = setInterval(() => {
          setBlockSecondsLeft((prev) => {
            if (prev <= 1) {
              updateBlockAndTimer();
              return 7200;
            }
            return prev - 1;
          });
        }, 1000);

        return () => clearInterval(timerInterval);
      }, []);

      const [fcFront, setFcFront] = useState("");
      const [fcBack, setFcBack] = useState("");
      const [flippedCardId, setFlippedCardId] = useState(null);

      const [subject, setSubject] = useState("");
      const [isRunning, setIsRunning] = useState(false);
      const [elapsed, setElapsed] = useState(0);
      const startTimeRef = useRef(null);
      const accumulatedTimeRef = useRef(0);
      const tickRef = useRef(null);

      const [pomoMinutes, setPomoMinutes] = useState(25);
      const [pomoSecondsLeft, setPomoSecondsLeft] = useState(25 * 60);
      const [isPomoRunning, setIsPomoRunning] = useState(false);
      const [pomoSubject, setPomoSubject] = useState("");
      const pomoEndTimeRef = useRef(null);
      const pomoRemainingAtPauseRef = useRef(25 * 60);
      const pomoTickRef = useRef(null);

      const [pIsRunning, setPIsRunning] = useState(false);
      const [pElapsed, setPElapsed] = useState(0);
      const [pCount, setPCount] = useState(0);
      const pStartTimeRef = useRef(null);
      const pAccumulatedTimeRef = useRef(0);
      const pTickRef = useRef(null);

      const [kpssDaysLeft, setKpssDaysLeft] = useState(0);

      useEffect(() => {
        const targetDate = new Date("2026-10-04T10:15:00");
        const updateKpssTimer = () => {
          const now = new Date();
          const diff = targetDate - now;
          if (diff > 0) {
            setKpssDaysLeft(Math.floor(diff / (1000 * 60 * 60 * 24)));
          } else {
            setKpssDaysLeft(0);
          }
        };
        updateKpssTimer();
        setCurrentQuoteIndex(Math.floor(Math.random() * MOTIVATIONS.length));
        setCurrentLoveText(generateInfiniteCompliment());
      }, []);

          if (matched) setActiveTopicSubj(matched);

      let bgMain = "#090D16", colorMain = "#F8FAFC", bgCard = "#111827", borderCard = "#1F2937", textMuted = "#94A3B8", bgInner = "#0D1322";
      if (theme === "oled") {

      } else if (theme === "light") {
        bgMain = "#F1F5F9"; colorMain = "#0F172A"; bgCard = "#FFFFFF"; borderCard = "#E2E8F0"; textMuted = "#64748B"; bgInner = "#F8FAFC";
      }

      useEffect(() => {
        const metaThemeColor = document.querySelector('meta[name="theme-color"]');
        if (metaThemeColor) metaThemeColor.setAttribute("content", bgMain);

      }, [bgMain]);

      const cycleTheme = () => {
        let next = "dark";
        if (theme === "dark") next = "oled";
        else if (theme === "oled") next = "light";
        else next = "dark";
        setTheme(next);
        try { localStorage.setItem("study-theme", next); } catch (e) {}

      const resetAllData = () => {
        if (confirm("Tüm çalışma verileriniz ve ilerlemeniz sıfırlanacak. Emin misiniz?")) {

          window.location.reload();

        try { localStorage.setItem("study-sessions-v8", JSON.stringify(next)); } catch (e) {}

        setExams(next);
        try { localStorage.setItem("study-exams-v1", JSON.stringify(next)); } catch (e) {}

        let next;
        if (favoriteCompliments.includes(txt)) {
          next = favoriteCompliments.filter(f => f !== txt);
        } else {
          next = [txt, ...favoriteCompliments];
          triggerConfetti();
        }
        setFavoriteCompliments(next);
        try { localStorage.setItem("study-fav-compliments-v1", JSON.stringify(next)); } catch (e) {}
      };

      const saveAdminLoveNote = (val) => {
        setAdminLoveNote(val);
        try { localStorage.setItem("study-admin-love-note-v1", val); } catch (e) {}
      };

      const toggleKpssArchiveItem = (year) => {
        const next = { ...kpssArchive, [year]: !kpssArchive[year] };
        setKpssArchive(next);
        try { localStorage.setItem("study-kpss-archive-v1", JSON.stringify(next)); } catch (e) {}
      };

      const handleSaveNote = () => {
        const nextNotes = { ...dailyNotes, [today]: currentNoteText };
        setDailyNotes(nextNotes);
        try { localStorage.setItem("study-daily-notes-v1", JSON.stringify(nextNotes)); } catch (e) {}
        alert("Günlük not kaydedildi!");
      };

      const handleAddWrongNote = (e) => {
        e.preventDefault();
        if (!newWrongText.trim()) return;
        const item = { id: Date.now(), text: newWrongText.trim(), subject: activeTopicSubj };
        const nextList = [item, ...wrongNotes];
        setWrongNotes(nextList);
        try { localStorage.setItem("study-wrong-notes-v1", JSON.stringify(nextList)); } catch (e) {}
        setNewWrongText("");
      };

      const deleteWrongNote = (id) => {
        const nextList = wrongNotes.filter(w => w.id !== id);
        setWrongNotes(nextList);
        try { localStorage.setItem("study-wrong-notes-v1", JSON.stringify(nextList)); } catch (e) {}
      };

      const handleAddFlashcard = (e) => {
        e.preventDefault();
        if (!fcFront.trim() || !fcBack.trim()) return;
        const card = { id: Date.now(), front: fcFront.trim(), back: fcBack.trim() };
        const nextList = [card, ...flashcards];
        setFlashcards(nextList);
        try { localStorage.setItem("study-flashcards-v1", JSON.stringify(nextList)); } catch (e) {}
        setFcFront(""); setFcBack("");
      };

      const deleteFlashcard = (id) => {
        const nextList = flashcards.filter(c => c.id !== id);
        setFlashcards(nextList);
        try { localStorage.setItem("study-flashcards-v1", JSON.stringify(nextList)); } catch (e) {}
      };

      const updateTargetMins = (val) => {
        const v = Math.max(10, val);
        setTargetStudyMins(v);
        try { localStorage.setItem("study-target-mins-v2", String(v)); } catch (e) {}
      };

      const updateTargetParagraphs = (val) => {
        const v = Math.max(5, val);
        setTargetParagraphs(v);
        try { localStorage.setItem("study-target-p-v2", String(v)); } catch (e) {}
      };

      useEffect(() => {
        if (isRunning) {
          startTimeRef.current = Date.now();
          tickRef.current = setInterval(() => {
            const now = Date.now();
            const diffSecs = Math.floor((now - startTimeRef.current) / 1000);
            setElapsed(accumulatedTimeRef.current + diffSecs);
          }, 200);
        } else {
          if (tickRef.current) clearInterval(tickRef.current);
          accumulatedTimeRef.current = elapsed;
        }
        return () => { if (tickRef.current) clearInterval(tickRef.current); };
      }, [isRunning]);

      useEffect(() => {
        if (isPomoRunning) {
          pomoEndTimeRef.current = Date.now() + (pomoRemainingAtPauseRef.current * 1000);
          pomoTickRef.current = setInterval(() => {
            const now = Date.now();
            const leftSecs = Math.ceil((pomoEndTimeRef.current - now) / 1000);
            if (leftSecs <= 0) {
              setIsPomoRunning(false);
              setPomoSecondsLeft(0);
              pomoRemainingAtPauseRef.current = 0;
              const newForest = forestCount + 1;
              setForestCount(newForest);
              try { localStorage.setItem("study-forest-count-v1", String(newForest)); } catch (e) {}
              triggerConfetti();
              alert("🎉 Pomodoro bitti! Ormanına 1 yeni odak ağacı eklendi!");
            } else {
              setPomoSecondsLeft(leftSecs);
            }
          }, 200);
        } else {
          if (pomoTickRef.current) clearInterval(pomoTickRef.current);
          pomoRemainingAtPauseRef.current = pomoSecondsLeft;
        }
        return () => { if (pomoTickRef.current) clearInterval(pomoTickRef.current); };
      }, [isPomoRunning, forestCount]);

      useEffect(() => {
        if (pIsRunning) {
          pStartTimeRef.current = Date.now();
          pTickRef.current = setInterval(() => {
            const now = Date.now();
            const diffSecs = Math.floor((now - pStartTimeRef.current) / 1000);
            setPElapsed(pAccumulatedTimeRef.current + diffSecs);
          }, 200);
        } else {
          if (pTickRef.current) clearInterval(pTickRef.current);
          pAccumulatedTimeRef.current = pElapsed;
        }
        return () => { if (pTickRef.current) clearInterval(pTickRef.current); };
      }, [pIsRunning]);

      const handleStartPause = () => {
        if (!isRunning && !subject.trim()) return;
        setIsRunning((r) => !r);
      };

      const handleFinish = () => {
        if (elapsed < 3) {
          setIsRunning(false); setElapsed(0); accumulatedTimeRef.current = 0; return;
        }
        const minutes = Math.max(1, Math.round(elapsed / 60));
        const session = { id: Date.now(), type: "ders", subject: subject.trim() || "Genel", minutes, seconds: elapsed, date: isoDay(new Date()) };
        saveSessions([session, ...sessions]);
        if (minutes >= 25) {
          const newForest = forestCount + 1;
          setForestCount(newForest);
          try { localStorage.setItem("study-forest-count-v1", String(newForest)); } catch (e) {}
        }
        triggerConfetti();
        setIsRunning(false); setElapsed(0); accumulatedTimeRef.current = 0;
      };

      const handleReset = () => { setIsRunning(false); setElapsed(0); accumulatedTimeRef.current = 0; };

      const selectPomoTime = (mins) => {
        setIsPomoRunning(false); setPomoMinutes(mins); setPomoSecondsLeft(mins * 60); pomoRemainingAtPauseRef.current = mins * 60;
      };

      const handlePomoFinish = () => {
        const elapsedSecs = (pomoMinutes * 60) - pomoSecondsLeft;
        if (elapsedSecs < 10) {
          setIsPomoRunning(false); setPomoSecondsLeft(pomoMinutes * 60); pomoRemainingAtPauseRef.current = pomoMinutes * 60; return;
        }
        const minutes = Math.max(1, Math.round(elapsedSecs / 60));
        const session = { id: Date.now(), type: "ders", subject: pomoSubject.trim() || "Pomodoro Çalışması", minutes, seconds: elapsedSecs, date: isoDay(new Date()) };
        saveSessions([session, ...sessions]);
        const newForest = forestCount + 1;
        setForestCount(newForest);
        try { localStorage.setItem("study-forest-count-v1", String(newForest)); } catch (e) {}
        triggerConfetti();
        setIsPomoRunning(false); setPomoSecondsLeft(pomoMinutes * 60); pomoRemainingAtPauseRef.current = pomoMinutes * 60;
      };

      const handlePStartPause = () => setPIsRunning((r) => !r);

      const handlePFinish = () => {
        if (pElapsed < 3 && pCount === 0) {
          setPIsRunning(false); setPElapsed(0); pAccumulatedTimeRef.current = 0; setPCount(0); return;
        }
        const minutes = Math.max(1, Math.round(pElapsed / 60));
        const log = { id: Date.now(), type: "paragraf", subject: "Paragraf / Soru", minutes, count: pCount, seconds: pElapsed, date: isoDay(new Date()) };
        saveSessions([log, ...sessions]);
        triggerConfetti();
        setPIsRunning(false); setPElapsed(0); pAccumulatedTimeRef.current = 0; setPCount(0);
      };

      const handlePReset = () => { setPIsRunning(false); setPElapsed(0); pAccumulatedTimeRef.current = 0; setPCount(0); };

      const deleteSession = (id) => saveSessions(sessions.filter((s) => s.id !== id));
      const deleteExam = (id) => saveExams(exams.filter((e) => e.id !== id));

      const handleAddExam = (e) => {
        e.preventDefault();
        if (!examName.trim()) return;
        const exam = {
          id: Date.now(),
          name: examName.trim(),
          tr: Number(examNetTr) || 0,
          mat: Number(examNetMat) || 0,
          sos: Number(examNetSos) || 0,
          fen: Number(examNetFen) || 0,
          total: (Number(examNetTr) || 0) + (Number(examNetMat) || 0) + (Number(examNetSos) || 0) + (Number(examNetFen) || 0),
          date: isoDay(new Date())
        };
        saveExams([exam, ...exams]);
        setExamName(""); setExamNetTr(""); setExamNetMat(""); setExamNetSos(""); setExamNetFen("");
      };

      const exportData = () => {
        const data = { sessions, exams, topics, topicMinutes, targetStudyMins, targetParagraphs, dailyNotes, wrongNotes, flashcards, forestCount, kpssArchive, favoriteCompliments, adminLoveNote };
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url; a.download = `ders-takip-yedek-${isoDay(new Date())}.json`; a.click();
      };

      const importData = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const data = JSON.parse(event.target.result);
            if (data.sessions) saveSessions(data.sessions);
            if (data.exams) saveExams(data.exams);
            if (data.topics) setTopics(data.topics);
            if (data.topicMinutes) setTopicMinutes(data.topicMinutes);
            if (data.dailyNotes) setDailyNotes(data.dailyNotes);
            if (data.wrongNotes) setWrongNotes(data.wrongNotes);
            if (data.flashcards) setFlashcards(data.flashcards);
            if (data.kpssArchive) setKpssArchive(data.kpssArchive);
            if (data.favoriteCompliments) setFavoriteCompliments(data.favoriteCompliments);
            if (data.adminLoveNote) saveAdminLoveNote(data.adminLoveNote);
            if (data.forestCount !== undefined) setForestCount(data.forestCount);
            if (data.targetStudyMins) updateTargetMins(data.targetStudyMins);
            if (data.targetParagraphs) updateTargetParagraphs(data.targetParagraphs);
            alert("Yedek başarıyla yüklendi!");
          } catch (err) { alert("Geçersiz yedek dosyası!"); }
        };
        reader.readAsText(file);
      };

      const todaySessions = sessions.filter((s) => s.date === today);
      const todayMinutes = todaySessions.filter(s => s.type !== "paragraf").reduce((a, s) => a + s.minutes, 0);
      const todayParagraphCount = todaySessions.filter(s => s.type === "paragraf").reduce((a, s) => a + (s.count || 0), 0);

      const isStudyGoalReached = todayMinutes >= targetStudyMins;
      const isParagraphGoalReached = todayParagraphCount >= targetParagraphs;

      const totalXp = useMemo(() => {
        const totalMin = sessions.reduce((acc, s) => acc + (s.minutes || 0), 0);
        const totalP = sessions.reduce((acc, s) => acc + (s.count || 0), 0);
        return (totalMin * 10) + (totalP * 5) + (forestCount * 50);
      }, [sessions, forestCount]);

      const currentLevel = Math.floor(totalXp / 500) + 1;
      const xpProgress = totalXp % 500;
      
      const levelTitle = useMemo(() => {
        if (currentLevel <= 2) return "Çırak Memur";
        if (currentLevel <= 5) return "Kararlı Aday";
        if (currentLevel <= 10) return "Kıdemli Uzman";
        return "ÖSYM Şampiyonu 🏆";
      }, [currentLevel]);

      const streakCount = useMemo(() => {
        if (!sessions || sessions.length === 0) return 0;
        let streak = 0;
        const dateObj = new Date();
        for (let i = 0; i < 60; i++) {
          const dStr = isoDay(dateObj);
          const hasStudied = sessions.some(s => s && s.date === dStr && (Number(s.minutes) || 0) > 0);
          if (hasStudied) { streak++; } else if (i > 0) { break; }
          dateObj.setDate(dateObj.getDate() - 1);
        }
        return streak;
      }, [sessions]);

      const badges = useMemo(() => {
        return [
          { id: 1, title: "🚀 İlk Adım", desc: "İlk çalışma oturumunu kaydet", unlocked: sessions.length > 0 },
          { id: 2, title: "🔥 İstikrarlı", desc: "3 günlük çalışma serisi yakala", unlocked: streakCount >= 3 },
          { id: 3, title: "🌲 Doğa Sever", desc: "Ormanında en az 3 ağaç büyüt", unlocked: forestCount >= 3 },
          { id: 4, title: "📚 Soru Canavarı", desc: "Toplam 100 soru/paragraf çöz", unlocked: sessions.filter(s => s.count).reduce((a,b)=>a+b.count, 0) >= 100 },
          { id: 5, title: "🎯 ÖSYM Adayı", desc: "En az 3 deneme sonucu kaydet", unlocked: exams.length >= 3 }
        ];
      }, [sessions, streakCount, forestCount, exams]);

      const filteredSessions = useMemo(() => {
        if (!filterDate) return sessions;
        return sessions.filter(s => s.date === filterDate);
      }, [sessions, filterDate]);

      const weekData = useMemo(() => {
        try {
          const now = new Date();
          const monday = new Date(now);
          monday.setDate(now.getDate() - mondayIndex(now));
          const days = [];
          for (let i = 0; i < 7; i++) {
            const d = new Date(monday);
            d.setDate(monday.getDate() + i);
            const dISO = isoDay(d);
            const mins = sessions.filter((s) => s && s.date === dISO && s.type !== "paragraf").reduce((a, s) => a + (Number(s.minutes) || 0), 0);
            days.push({ label: DAYS[i], dakika: mins });
          }
          return days;
        } catch (err) { return DAYS.map(d => ({ label: d, dakika: 0 })); }
      }, [sessions]);

      const weekMinutes = weekData.reduce((a, d) => a + d.dakika, 0);
      const maxWeekMin = Math.max(1, ...weekData.map(d => d.dakika));

      const subjectDistribution = useMemo(() => {
        try {
          const map = {};
          sessions.filter(s => s && s.type !== "paragraf").forEach(s => {
            const subjName = s.subject || "Genel";
            map[subjName] = (map[subjName] || 0) + (Number(s.minutes) || 0);
          });
          return Object.entries(map).sort((a, b) => b[1] - a[1]);
        } catch (err) { return []; }
      }, [sessions]);

      if (!loaded) return null;

      const activeBlock = KPSS_ROTATING_BLOCKS[blockIndex];
      const isFav = favoriteCompliments.includes(currentLoveText);

      return (
        <div style={{ 
          fontFamily: "'Inter', sans-serif", 
          background: bgMain, 
          color: colorMain, 
          minHeight: "100vh",
          width: "100%",
          maxWidth: "680px", 
          margin: "0 auto", 
          padding: "24px 16px 110px", 
          boxSizing: "border-box",
          position: "relative",
          overflowX: "hidden"
        }}>
          
          {/* SEVGİLİYE ÖZEL İLTİFAT KÖŞESİ (5 ZARİF KALPLİ) */}
          <div className="love-card-glow" style={{ background: "linear-gradient(135deg, rgba(244, 63, 94, 0.15) 0%, rgba(236, 72, 153, 0.1) 100%)", border: "1px solid rgba(244, 63, 94, 0.4)", borderRadius: "20px", padding: "18px 20px", marginBottom: "16px", position: "relative", overflow: "hidden" }}>
            
            <span className="heart-float-1" style={{ position: "absolute", top: "8px", left: "12px", fontSize: "15px", pointerEvents: "none", zIndex: 1 }}>❤️</span>
            <span className="heart-float-2" style={{ position: "absolute", bottom: "6px", right: "15px", fontSize: "14px", pointerEvents: "none", zIndex: 1 }}>💖</span>
            <span className="heart-float-3" style={{ position: "absolute", top: "10px", right: "28%", fontSize: "12px", pointerEvents: "none", zIndex: 1 }}>🌸</span>
            <span className="heart-float-4" style={{ position: "absolute", bottom: "10px", left: "25%", fontSize: "13px", pointerEvents: "none", zIndex: 1 }}>✨</span>
            <span className="heart-float-5" style={{ position: "absolute", top: "45%", right: "8px", fontSize: "11px", pointerEvents: "none", zIndex: 1 }}>💕</span>

            <div style={{ position: "relative", zIndex: 2 }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: "6px" }}>
                <div style={{ display: "flex", alignItems: "center", gap: "6px", margin: "0 auto" }}>
                  <span style={{ fontSize: "16px" }}>💖</span>
                  <span style={{ fontSize: "11px", fontWeight: 800, color: "#F43F5E", letterSpacing: "0.5px", textTransform: "uppercase" }}>Sana Özel İltifat Köşesi</span>
                </div>
                <button onClick={() => toggleFavoriteCompliment(currentLoveText)} style={{ background: "transparent", border: "none", cursor: "pointer", fontSize: "18px" }} title="Favorilere Ekle">{isFav ? "❤️" : "🤍"}</button>
              </div>

              <div onClick={() => setCurrentLoveText(generateInfiniteCompliment())} style={{ cursor: "pointer", textAlign: "center" }}>
                <p style={{ fontSize: "13px", color: colorMain, margin: 0, fontWeight: 700, lineHeight: 1.5, textShadow: "0 1px 2px rgba(0,0,0,0.3)" }}>
                  "{currentLoveText}"
                </p>
                <span style={{ fontSize: "10px", color: textMuted, display: "block", marginTop: "6px" }}>(Yeni ve farklı bir iltifat için karta dokun 💕)</span>
              </div>
            </div>

          <div onClick={() => { setIsNoteOpened(!isNoteOpened); if (!isNoteOpened) triggerConfetti(); }} style={{ background: bgCard, border: `1px solid ${borderCard}`, borderRadius: "16px", padding: "16px 18px", marginBottom: "16px", borderLeft: "4px solid #F43F5E", boxShadow: "0 4px 15px rgba(0,0,0,0.1)", cursor: "pointer", textAlign: "center", transition: "all 0.2s ease" }}>
            <p style={{ fontSize: "11px", color: "#F43F5E", margin: "0 0 4px", fontWeight: 800, letterSpacing: "0.5px" }}>💌 GÜNÜN SÜRPRİZ NOTU</p>
            {!isNoteOpened ? (
              <div style={{ padding: "6px 0" }}>
                <p style={{ fontSize: "13px", color: colorMain, margin: 0, fontWeight: 700 }}>🎁 Sana bir sürprizim var, açmak için dokun 💕</p>

            ) : (
              <div style={{ animation: "pulseAlert 0.5s ease" }}>
                <p style={{ fontSize: "13px", color: colorMain, margin: "6px 0 4px", fontWeight: 600, fontStyle: "italic", lineHeight: 1.5 }}>"{adminLoveNote}"</p>
                <span style={{ fontSize: "10px", color: textMuted, display: "block", marginTop: "6px" }}>(Kapatmak için tekrar dokun 🌸)</span>
              </div>

          </div>

          {/* PROFESYONEL ÜST HEADER & SEVİYE KARTI */}
          <div style={{ background: bgCard, border: `1px solid ${borderCard}`, borderRadius: "20px", padding: "18px 20px", marginBottom: "16px", boxShadow: "0 10px 30px rgba(0,0,0,0.25)" }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: "12px" }}>
              <div style={{ display: "flex", alignItems: "center", gap: "10px" }}>
                <span style={{ background: "linear-gradient(135deg, #38BDF8 0%, #2DD4BF 100%)", color: "#090D16", padding: "5px 12px", borderRadius: "20px", fontSize: "11px", fontWeight: 800, letterSpacing: "0.5px" }}>

              <span style={{ fontSize: "12px", color: textMuted, fontWeight: 700 }}>{totalXp} XP</span>

            <div style={{ width: "100%", background: bgInner, height: "8px", borderRadius: "6px", overflow: "hidden" }}>
              <div style={{ width: `${(xpProgress / 500) * 100}%`, background: "linear-gradient(90deg, #38BDF8, #2DD4BF)", height: "100%", transition: "width 0.4s ease" }}></div>
            </div>
          </div>

          {/* İSTATİSTİK ÖZET BANNERI */}
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: "10px", marginBottom: "16px" }}>
            <div style={{ background: bgCard, border: `1px solid ${borderCard}`, borderRadius: "16px", padding: "14px 10px", textAlign: "center", boxShadow: "0 4px 15px rgba(0,0,0,0.1)" }}>

              <p style={{ fontSize: "16px", fontWeight: 800, margin: 0, color: "#F59E0B" }}>{kpssDaysLeft} Gün</p>

              <p style={{ fontSize: "16px", fontWeight: 800, margin: 0, color: "#38BDF8" }}>{streakCount} Gün</p>
            </div>

              <p style={{ fontSize: "10px", color: textMuted, margin: "0 0 4px", fontWeight: 700, textTransform: "uppercase", letterSpacing: "0.5px" }}>🌲 ORMAN</p>
              <p style={{ fontSize: "16px", fontWeight: 800, margin: 0, color: "#2DD4BF" }}>{forestCount} Ağaç</p>

            <p style={{ fontSize: "12px", color: "#38BDF8", margin: 0, fontStyle: "italic", fontWeight: 500, lineHeight: 1.5 }}>
              💡 "{MOTIVATIONS[currentQuoteIndex]}" <span style={{ fontSize: "10px", color: textMuted, display: "block", marginTop: "4px" }}>(Sözü değiştirmek için tıkla)</span>

          <div style={{ display: "flex", justifyContent: "flex-end", marginBottom: "16px" }}>

            <div style={{ position: "fixed", top: 0, left: 0, right: 0, bottom: 0, background: "rgba(0,0,0,0.7)", zIndex: 99999, display: "flex", alignItems: "center", justifyContent: "center", padding: "20px" }}>
              <div style={{ background: bgCard, border: `1px solid ${borderCard}`, borderRadius: "24px", width: "100%", maxWidth: "420px", padding: "24px", boxShadow: "0 20px 40px rgba(0,0,0,0.5)", maxHeight: "90vh", overflowY: "auto" }}>
