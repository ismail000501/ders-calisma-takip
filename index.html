<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0B0F19">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Ders Çalışma Takip</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100vh;
      background: #0B0F19;
      font-family: 'Inter', sans-serif;
      touch-action: manipulation;
      -webkit-text-size-adjust: 100%;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo, useCallback } = React;

    const DAYS = ["Pzt", "Sal", "Çar", "Per", "Cum", "Cmt", "Paz"];

    function pad(n) { return String(n).padStart(2, "0"); }
    function formatClock(totalSeconds) {
      const h = Math.floor(totalSeconds / 3600);
      const m = Math.floor((totalSeconds % 3600) / 60);
      const s = totalSeconds % 60;
      return h > 0 ? `${pad(h)}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`;
    }
    function formatMinutes(mins) {
      const h = Math.floor(mins / 60);
      const m = Math.round(mins % 60);
      if (h === 0) return `${m} dk`;
      return `${h} sa ${m} dk`;
    }
    function isoDay(date) { return date.toISOString().slice(0, 10); }
    function mondayIndex(date) { return (date.getDay() + 6) % 7; }

    function StudyTracker() {
      const [loaded, setLoaded] = useState(false);
      const [theme, setTheme] = useState("dark");
      const [sessions, setSessions] = useState([]);
      
      const [mode, setMode] = useState("kronometre");
      
      // Ders Kronometre State'leri (Gerçek zaman bazlı)
      const [subject, setSubject] = useState("");
      const [isRunning, setIsRunning] = useState(false);
      const [elapsed, setElapsed] = useState(0);
      const startTimeRef = useRef(null);
      const accumulatedTimeRef = useRef(0);
      const tickRef = useRef(null);

      // Pomodoro State'leri (Gerçek zaman bazlı)
      const [pomoMinutes, setPomoMinutes] = useState(25);
      const [pomoSecondsLeft, setPomoSecondsLeft] = useState(25 * 60);
      const [isPomoRunning, setIsPomoRunning] = useState(false);
      const [pomoSubject, setPomoSubject] = useState("");
      const pomoEndTimeRef = useRef(null);
      const pomoRemainingAtPauseRef = useRef(25 * 60);
      const pomoTickRef = useRef(null);

      // Paragraf Kronometre State'leri (Gerçek zaman bazlı)
      const [pIsRunning, setPIsRunning] = useState(false);
      const [pElapsed, setPElapsed] = useState(0);
      const [pCount, setPCount] = useState(0);
      const pStartTimeRef = useRef(null);
      const pAccumulatedTimeRef = useRef(0);
      const pTickRef = useRef(null);

      const [targetStudyMins, setTargetStudyMins] = useState(180);
      const [targetParagraphs, setTargetParagraphs] = useState(50);

      useEffect(() => {
        (async () => {
          try {
            const t = localStorage.getItem("study-theme");
            if (t) setTheme(t);
          } catch (e) {}
          try {
            const s = localStorage.getItem("study-sessions-v7");
            if (s) setSessions(JSON.parse(s));
          } catch (e) {}
          try {
            const ts = localStorage.getItem("study-target-mins-v2");
            if (ts) setTargetStudyMins(Number(ts));
          } catch (e) {}
          try {
            const tp = localStorage.getItem("study-target-p-v2");
            if (tp) setTargetParagraphs(Number(tp));
          } catch (e) {}
          setLoaded(true);
        })();
      }, []);

      const toggleTheme = () => {
        const nextTheme = theme === "dark" ? "light" : "dark";
        setTheme(nextTheme);
        try { localStorage.setItem("study-theme", nextTheme); } catch (e) {}
      };

      const saveSessions = useCallback((next) => {
        setSessions(next);
        try { localStorage.setItem("study-sessions-v7", JSON.stringify(next)); } catch (e) {}
      }, []);

      const updateTargetMins = (val) => {
        const v = Math.max(10, val);
        setTargetStudyMins(v);
        try { localStorage.setItem("study-target-mins-v2", String(v)); } catch (e) {}
      };

      const updateTargetParagraphs = (val) => {
        const v = Math.max(5, val);
        setTargetParagraphs(v);
        try { localStorage.setItem("study-target-p-v2", String(v)); } catch (e) {}
      };

      // 1. Ders Kronometre Gerçek Zamanlı Döngü
      useEffect(() => {
        if (isRunning) {
          startTimeRef.current = Date.now();
          tickRef.current = setInterval(() => {
            const now = Date.now();
            const diffSecs = Math.floor((now - startTimeRef.current) / 1000);
            setElapsed(accumulatedTimeRef.current + diffSecs);
          }, 200);
        } else {
          if (tickRef.current) clearInterval(tickRef.current);
          accumulatedTimeRef.current = elapsed;
        }
        return () => { if (tickRef.current) clearInterval(tickRef.current); };
      }, [isRunning]);

      // 2. Pomodoro Gerçek Zamanlı Döngü
      useEffect(() => {
        if (isPomoRunning) {
          pomoEndTimeRef.current = Date.now() + (pomoRemainingAtPauseRef.current * 1000);
          pomoTickRef.current = setInterval(() => {
            const now = Date.now();
            const leftSecs = Math.ceil((pomoEndTimeRef.current - now) / 1000);
            if (leftSecs <= 0) {
              setIsPomoRunning(false);
              setPomoSecondsLeft(0);
              pomoRemainingAtPauseRef.current = 0;
              alert("Pomodoro süresi bitti! Harika iş çıkardın.");
            } else {
              setPomoSecondsLeft(leftSecs);
            }
          }, 200);
        } else {
          if (pomoTickRef.current) clearInterval(pomoTickRef.current);
          pomoRemainingAtPauseRef.current = pomoSecondsLeft;
        }
        return () => { if (pomoTickRef.current) clearInterval(pomoTickRef.current); };
      }, [isPomoRunning]);

      // 3. Paragraf Kronometre Gerçek Zamanlı Döngü
      useEffect(() => {
        if (pIsRunning) {
          pStartTimeRef.current = Date.now();
          pTickRef.current = setInterval(() => {
            const now = Date.now();
            const diffSecs = Math.floor((now - pStartTimeRef.current) / 1000);
            setPElapsed(pAccumulatedTimeRef.current + diffSecs);
          }, 200);
        } else {
          if (pTickRef.current) clearInterval(pTickRef.current);
          pAccumulatedTimeRef.current = pElapsed;
        }
        return () => { if (pTickRef.current) clearInterval(pTickRef.current); };
      }, [pIsRunning]);

      const handleStartPause = () => {
        if (!isRunning && !subject.trim()) return;
        setIsRunning((r) => !r);
      };

      const handleFinish = () => {
        if (elapsed < 3) {
          setIsRunning(false);
          setElapsed(0);
          accumulatedTimeRef.current = 0;
          return;
        }
        const minutes = Math.max(1, Math.round(elapsed / 60));
        const session = { 
          id: Date.now(), 
          type: "ders", 
          subject: subject.trim() || "Genel", 
          minutes, 
          seconds: elapsed,
          date: isoDay(new Date()) 
        };
        saveSessions([session, ...sessions]);
        setIsRunning(false);
        setElapsed(0);
        accumulatedTimeRef.current = 0;
      };

      const handleReset = () => {
        setIsRunning(false);
        setElapsed(0);
        accumulatedTimeRef.current = 0;
      };

      const selectPomoTime = (mins) => {
        setIsPomoRunning(false);
        setPomoMinutes(mins);
        setPomoSecondsLeft(mins * 60);
        pomoRemainingAtPauseRef.current = mins * 60;
      };

      const handlePomoFinish = () => {
        const elapsedSecs = (pomoMinutes * 60) - pomoSecondsLeft;
        if (elapsedSecs < 10) {
          setIsPomoRunning(false);
          setPomoSecondsLeft(pomoMinutes * 60);
          pomoRemainingAtPauseRef.current = pomoMinutes * 60;
          return;
        }
        const minutes = Math.max(1, Math.round(elapsedSecs / 60));
        const session = {
          id: Date.now(),
          type: "ders",
          subject: pomoSubject.trim() || "Pomodoro Çalışması",
          minutes,
          seconds: elapsedSecs,
          date: isoDay(new Date())
        };
        saveSessions([session, ...sessions]);
        setIsPomoRunning(false);
        setPomoSecondsLeft(pomoMinutes * 60);
        pomoRemainingAtPauseRef.current = pomoMinutes * 60;
      };

      const handlePStartPause = () => {
        setPIsRunning((r) => !r);
      };

      const handlePFinish = () => {
        if (pElapsed < 3 && pCount === 0) {
          setPIsRunning(false);
          setPElapsed(0);
          pAccumulatedTimeRef.current = 0;
          setPCount(0);
          return;
        }
        const minutes = Math.max(1, Math.round(pElapsed / 60));
        const log = { 
          id: Date.now(), 
          type: "paragraf", 
          subject: "Paragraf / Soru", 
          minutes, 
          count: pCount, 
          seconds: pElapsed, 
          date: isoDay(new Date()) 
        };
        saveSessions([log, ...sessions]);
        setPIsRunning(false);
        setPElapsed(0);
        pAccumulatedTimeRef.current = 0;
        setPCount(0);
      };

      const handlePReset = () => {
        setPIsRunning(false);
        setPElapsed(0);
        pAccumulatedTimeRef.current = 0;
        setPCount(0);
      };

      const deleteSession = (id) => saveSessions(sessions.filter((s) => s.id !== id));

      const today = isoDay(new Date());
      const todaySessions = sessions.filter((s) => s.date === today);
      
      const todayMinutes = todaySessions.filter(s => s.type !== "paragraf").reduce((a, s) => a + s.minutes, 0);
      const todayParagraphMinutes = todaySessions.filter(s => s.type === "paragraf").reduce((a, s) => a + s.minutes, 0);
      const todayParagraphCount = todaySessions.filter(s => s.type === "paragraf").reduce((a, s) => a + (s.count || 0), 0);

      const subjectDistribution = useMemo(() => {
        const map = {};
        sessions.filter(s => s.type !== "paragraf").forEach(s => {
          map[s.subject] = (map[s.subject] || 0) + s.minutes;
        });
        return Object.entries(map).sort((a, b) => b[1] - a[1]);
      }, [sessions]);

      const weekData = useMemo(() => {
        const now = new Date();
        const monday = new Date(now);
        monday.setDate(now.getDate() - mondayIndex(now));
        const days = [];
        for (let i = 0; i < 7; i++) {
          const d = new Date(monday);
          d.setDate(monday.getDate() + i);
          const dISO = isoDay(d);
          const mins = sessions.filter((s) => s.date === dISO && s.type !== "paragraf").reduce((a, s) => a + s.minutes, 0);
          days.push({ label: DAYS[i], dakika: mins });
        }
        return days;
      }, [sessions]);

      const weekMinutes = weekData.reduce((a, d) => a + d.dakika, 0);

      const isDark = theme === "dark";
      const bgMain = isDark ? "#0B0F19" : "#F8FAFC";
      const colorMain = isDark ? "#E2E8F0" : "#1E293B";
      const bgCard = isDark ? "#131B2E" : "#FFFFFF";
      const borderCard = isDark ? "#1E293B" : "#E2E8F0";
      const textMuted = isDark ? "#94A3B8" : "#64748B";
      const bgInner = isDark ? "#0B0F19" : "#F1F5F9";

      if (!loaded) return null;

      return (
        <div style={{ 
          fontFamily: "'Inter', sans-serif", 
          background: bgMain, 
          color: colorMain, 
          minHeight: "100vh",
          width: "100%",
          padding: "20px 16px 40px", 
          maxWidth: "720px", 
          margin: "0 auto", 
          boxSizing: "border-box" 
        }}>
          
          {/* Sağ Üst Tema Butonu */}
          <div style={{ display: "flex", justifyContent: "flex-end", marginBottom: "12px" }}>
            <button 
              onClick={toggleTheme} 
              style={{ 
                background: bgCard, 
                color: colorMain, 
                border: `1px solid ${borderCard}`, 
                borderRadius: "50%", 
                width: "40px", 
                height: "40px", 
                display: "flex", 
                alignItems: "center", 
                justifyContent: "center", 
                cursor: "pointer",
                fontSize: "18px",
                boxShadow: "0 2px 5px rgba(0,0,0,0.1)"
              }}
              title="Temayı Değiştir"
            >
              {isDark ? "🌞" : "🌙"}
            </button>
          </div>

          {/* GÜNLÜK HEDEF VE AYARLAR KARTI */}
          <div style={{ background: bgCard, border: `1px solid ${borderCard}`, borderRadius: "12px", padding: "16px", marginBottom: "20px" }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: "12px" }}>
              <span style={{ fontSize: "13px", fontWeight: 600, color: textMuted }}>🎯 Günlük Hedefler ve İlerleme</span>
            </div>

            <div style={{ marginBottom: "14px" }}>
              <div style={{ display: "flex", justifyContent: "space-between", fontSize: "13px", marginBottom: "6px" }}>
                <span>Çalışma: <strong>{todayMinutes} dk</strong> / <input type="number" value={targetStudyMins} onChange={(e) => updateTargetMins(Number(e.target.value))} style={{ width: "60px", background: bgInner, border: `1px solid ${borderCard}`, color: colorMain, borderRadius: "4px", padding: "2px 4px", fontSize: "12px", textAlign: "center" }} /> dk</span>
                <span style={{ color: textMuted }}>%{Math.round((todayMinutes / targetStudyMins) * 100)}</span>
              </div>
              <div style={{ width: "100%", background: bgInner, height: "10px", borderRadius: "5px", overflow: "hidden" }}>
                <div style={{ width: `${Math.min(100, (todayMinutes / targetStudyMins) * 100)}%`, background: "#38BDF8", height: "100%", transition: "width 0.3s ease" }}></div>
              </div>
            </div>

            <div>
              <div style={{ display: "flex", justifyContent: "space-between", fontSize: "13px", marginBottom: "6px" }}>
                <span>Paragraf: <strong>{todayParagraphCount} soru</strong> / <input type="number" value={targetParagraphs} onChange={(e) => updateTargetParagraphs(Number(e.target.value))} style={{ width: "60px", background: bgInner, border: `1px solid ${borderCard}`, color: colorMain, borderRadius: "4px", padding: "2px 4px", fontSize: "12px", textAlign: "center" }} /> soru</span>
                <span style={{ color: textMuted }}>%{Math.round((todayParagraphCount / targetParagraphs) * 100)}</span>
              </div>
              <div style={{ width: "100%", background: bgInner, height: "10px", borderRadius: "5px", overflow: "hidden" }}>
                <div style={{ width: `${Math.min(100, (todayParagraphCount / targetParagraphs) * 100)}%`, background: "#2DD4BF", height: "100%", transition: "width 0.3s ease" }}></div>
              </div>
            </div>
          </div>


          {/* MOD SEÇİMİ */}
          <div style={{ display: "flex", justifyContent: "center", gap: "10px", marginBottom: "16px" }}>
            <button onClick={() => setMode("kronometre")} style={{ background: mode === "kronometre" ? "#38BDF8" : bgCard, color: mode === "kronometre" ? "#0B0F19" : colorMain, border: `1px solid ${borderCard}`, borderRadius: "8px", padding: "8px 16px", fontWeight: 600, cursor: "pointer", fontSize: "13px" }}>
              ⏱️ Kronometre
            </button>
            <button onClick={() => setMode("pomodoro")} style={{ background: mode === "pomodoro" ? "#38BDF8" : bgCard, color: mode === "pomodoro" ? "#0B0F19" : colorMain, border: `1px solid ${borderCard}`, borderRadius: "8px", padding: "8px 16px", fontWeight: 600, cursor: "pointer", fontSize: "13px" }}>
              🍅 Pomodoro Modu
            </button>
          </div>


          {/* DERS KRONOMETRESİ */}
          {mode === "kronometre" && (
            <div style={{ background: bgCard, border: `1px solid ${borderCard}`, borderRadius: "12px", padding: "20px", marginBottom: "24px", textAlign: "center" }}>
              <p style={{ fontSize: "13px", color: textMuted, margin: "0 0 4px" }}>DERS ÇALIŞMA KRONOMETRESİ</p>
              <div style={{ margin: "15px 0", fontSize: "40px", fontWeight: "bold", fontFamily: "serif" }}>
                {formatClock(elapsed)}
              </div>
              <div style={{ display: "flex", gap: "8px", justifyContent: "center", marginBottom: "14px" }}>
                <input placeholder="Ne çalışıyorsun? (ör. Matematik)" value={subject} onChange={(e) => setSubject(e.target.value)} disabled={isRunning} style={{ width: "100%", maxWidth: "280px", padding: "10px 12px", borderRadius: "8px", border: `1px solid ${borderCard}`, background: bgInner, color: colorMain, fontSize: "14px" }} />
              </div>
              <div style={{ display: "flex", gap: "10px", justifyContent: "center", flexWrap: "wrap" }}>
                <button onClick={handleStartPause} style={{ background: "#38BDF8", color: "#0B0F19", borderRadius: "8px", padding: "10px 20px", border: "none", fontWeight: 600, cursor: "pointer", fontSize: "14px" }}>
                  {isRunning ? "Duraklat" : "Başla"}
                </button>
                <button onClick={handleFinish} style={{ background: "#2DD4BF", color: "#0B0F19", borderRadius: "8px", padding: "10px 20px", border: "none", fontWeight: 600, cursor: "pointer", fontSize: "14px" }}>
                  Bitir ve Kaydet
                </button>
                <button onClick={handleReset} style={{ background: bgInner, color: colorMain, border: `1px solid ${borderCard}`, borderRadius: "8px", padding: "10px 14px", cursor: "pointer", fontSize: "14px" }}>
                  Sıfırla
                </button>
              </div>
            </div>
          )}


          {/* POMODORO MODU */}
          {mode === "pomodoro" && (
            <div style={{ background: bgCard, border: `1px solid ${borderCard}`, borderRadius: "12px", padding: "20px", marginBottom: "24px", textAlign: "center" }}>
              <p style={{ fontSize: "13px", color: textMuted, margin: "0 0 4px" }}>POMODORO GERİ SAYIM</p>
              
              <div style={{ display: "flex", justifyContent: "center", gap: "6px", margin: "10px 0 15px" }}>
                {[20, 25, 45, 50].map((m) => (
                  <button key={m} onClick={() => selectPomoTime(m)} style={{ background: pomoMinutes === m ? "#38BDF8" : bgInner, color: pomoMinutes === m ? "#0B0F19" : colorMain, border: `1px solid ${borderCard}`, borderRadius: "6px", padding: "4px 10px", fontSize: "12px", fontWeight: "bold", cursor: "pointer" }}>
                    {m} dk
                  </button>
                ))}
              </div>

              <div style={{ margin: "15px 0", fontSize: "42px", fontWeight: "bold", fontFamily: "serif", color: "#F59E0B" }}>
                {formatClock(pomoSecondsLeft)}
              </div>

              <div style={{ display: "flex", gap: "8px", justifyContent: "center", marginBottom: "14px" }}>
                <input placeholder="Pomodoro Dersi (ör. Fizik)" value={pomoSubject} onChange={(e) => setPomoSubject(e.target.value)} disabled={isPomoRunning} style={{ width: "100%", maxWidth: "280px", padding: "10px 12px", borderRadius: "8px", border: `1px solid ${borderCard}`, background: bgInner, color: colorMain, fontSize: "14px" }} />
              </div>

              <div style={{ display: "flex", gap: "10px", justifyContent: "center", flexWrap: "wrap" }}>
                <button onClick={() => setIsPomoRunning(!isPomoRunning)} style={{ background: "#38BDF8", color: "#0B0F19", borderRadius: "8px", padding: "10px 20px", border: "none", fontWeight: 600, cursor: "pointer", fontSize: "14px" }}>
                  {isPomoRunning ? "Duraklat" : "Başla"}
                </button>
                <button onClick={handlePomoFinish} style={{ background: "#2DD4BF", color: "#0B0F19", borderRadius: "8px", padding: "10px 20px", border: "none", fontWeight: 600, cursor: "pointer", fontSize: "14px" }}>
                  Bitir ve Kaydet
                </button>
                <button onClick={() => { setIsPomoRunning(false); setPomoSecondsLeft(pomoMinutes * 60); pomoRemainingAtPauseRef.current = pomoMinutes * 60; }} style={{ background: bgInner, color: colorMain, border: `1px solid ${borderCard}`, borderRadius: "8px", padding: "10px 14px", cursor: "pointer", fontSize: "14px" }}>
                  Sıfırla
                </button>
              </div>
            </div>
          )}


          {/* PARAGRAF KRONOMETRESİ */}
          <div style={{ background: bgCard, border: `1px solid ${borderCard}`, borderRadius: "12px", padding: "20px", marginBottom: "24px", textAlign: "center" }}>
            <p style={{ fontSize: "13px", color: textMuted, margin: "0 0 4px" }}>PARAGRAF / SORU KRONOMETRESİ</p>
            <div style={{ margin: "15px 0", fontSize: "38px", fontWeight: "bold", fontFamily: "serif", color: "#2DD4BF" }}>
              {formatClock(pElapsed)}
            </div>
            <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: "12px", marginBottom: "16px" }}>
              <span style={{ fontSize: "14px", color: textMuted }}>Çözülen Soru:</span>
              <span style={{ fontSize: "20px", fontWeight: 700 }}>{pCount} adet</span>
            </div>
            <div style={{ display: "flex", gap: "6px", justifyContent: "center", marginBottom: "16px" }}>
              <button onClick={() => setPCount(c => Math.max(0, c - 5))} style={{ background: bgInner, color: colorMain, border: `1px solid ${borderCard}`, borderRadius: "8px", padding: "6px 12px", fontWeight: "bold", cursor: "pointer" }}>-5</button>
              <button onClick={() => setPCount(c => Math.max(0, c - 1))} style={{ background: bgInner, color: colorMain, border: `1px solid ${borderCard}`, borderRadius: "8px", padding: "6px 12px", fontWeight: "bold", cursor: "pointer" }}>-1</button>
              <button onClick={() => setPCount(c => c + 1)} style={{ background: "#2DD4BF", color: "#0B0F19", border: "none", borderRadius: "8px", padding: "6px 14px", fontWeight: "bold", cursor: "pointer" }}>+1</button>
              <button onClick={() => setPCount(c => c + 5)} style={{ background: "#2DD4BF", color: "#0B0F19", border: "none", borderRadius: "8px", padding: "6px 14px", fontWeight: "bold", cursor: "pointer" }}>+5</button>
            </div>
            <div style={{ display: "flex", gap: "10px", justifyContent: "center", flexWrap: "wrap" }}>
              <button onClick={handlePStartPause} style={{ background: "#2DD4BF", color: "#0B0F19", borderRadius: "8px", padding: "10px 20px", border: "none", fontWeight: 600, cursor: "pointer", fontSize: "14px" }}>
                {pIsRunning ? "Duraklat" : "Başla"}
              </button>
              <button onClick={handlePFinish} style={{ background: "#38BDF8", color: "#0B0F19", borderRadius: "8px", padding: "10px 20px", border: "none", fontWeight: 600, cursor: "pointer", fontSize: "14px" }}>
                Bitir ve Kaydet
              </button>
              <button onClick={handlePReset} style={{ background: bgInner, color: colorMain, border: `1px solid ${borderCard}`, borderRadius: "8px", padding: "10px 14px", cursor: "pointer", fontSize: "14px" }}>
                Sıfırla
              </button>
            </div>
          </div>


          {/* DERSLERE GÖRE DAĞILIM ÖZETİ */}
          {subjectDistribution.length > 0 && (
            <div style={{ background: bgCard, border: `1px solid ${borderCard}`, borderRadius: "12px", padding: "16px", marginBottom: "24px" }}>
              <p style={{ fontSize: "13px", color: textMuted, margin: "0 0 12px" }}>Derslere Göre Toplam Dağılım</p>
              <div style={{ display: "flex", flexDirection: "column", gap: "8px" }}>
                {subjectDistribution.map(([subj, mins]) => (
                  <div key={subj} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", fontSize: "13px", background: bgInner, padding: "8px 12px", borderRadius: "8px", border: `1px solid ${borderCard}` }}>
                    <span style={{ fontWeight: 600 }}>{subj}</span>
                    <span>{formatMinutes(mins)}</span>
                  </div>
                ))}
              </div>
            </div>
          )}


          {/* ÖZET KARTLARI */}
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "12px", marginBottom: "24px" }}>
            <div style={{ background: bgCard, border: `1px solid ${borderCard}`, borderRadius: "12px", padding: "14px" }}>
              <p style={{ fontSize: "12px", color: textMuted, margin: "0 0 4px" }}>Bugün ders</p>
              <p style={{ fontSize: "18px", fontWeight: 600, margin: 0 }}>{formatMinutes(todayMinutes)}</p>
            </div>
            <div style={{ background: bgCard, border: `1px solid ${borderCard}`, borderRadius: "12px", padding: "14px" }}>
              <p style={{ fontSize: "12px", color: textMuted, margin: "0 0 4px" }}>Bugün paragraf</p>
              <p style={{ fontSize: "18px", fontWeight: 600, margin: 0 }}>{formatMinutes(todayParagraphMinutes)} ({todayParagraphCount} soru)</p>
            </div>
            <div style={{ background: bgCard, border: `1px solid ${borderCard}`, borderRadius: "12px", padding: "14px", gridColumn: "span 2" }}>
              <p style={{ fontSize: "12px", color: textMuted, margin: "0 0 4px" }}>Bu hafta toplam ders</p>
              <p style={{ fontSize: "20px", fontWeight: 600, margin: 0 }}>{formatMinutes(weekMinutes)}</p>
            </div>
          </div>

          {/* Haftalık Çalışma Çizelgesi */}
          <div style={{ background: bgCard, border: `1px solid ${borderCard}`, borderRadius: "12px", padding: "16px", marginBottom: "24px" }}>
            <p style={{ fontSize: "13px", color: textMuted, margin: "0 0 12px" }}>Haftalık çalışma (dakika)</p>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: "6px", textAlign: "center" }}>
              {weekData.map((d, i) => (
                <div key={i} style={{ background: bgInner, border: `1px solid ${borderCard}`, borderRadius: "8px", padding: "8px 2px" }}>
                  <p style={{ fontSize: "10px", color: textMuted, margin: "0 0 4px" }}>{d.label}</p>
                  <p style={{ fontSize: "12px", fontWeight: 600, margin: 0 }}>{d.dakika}d</p>
                </div>
              ))}
            </div>
          </div>

          {/* Geçmiş Oturumlar */}
          <div style={{ background: bgCard, border: `1px solid ${borderCard}`, borderRadius: "12px", padding: "16px" }}>
            <p style={{ fontSize: "13px", color: textMuted, margin: "0 0 12px" }}>Geçmiş oturumlar</p>
            {sessions.length === 0 && <p style={{ fontSize: "13px", color: textMuted, margin: 0 }}>Henüz kayıt yok.</p>}
            <div style={{ display: "flex", flexDirection: "column", gap: "6px", maxHeight: "240px", overflowY: "auto" }}>
              {sessions.map((item) => (
                <div key={item.id} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", fontSize: "13px", padding: "8px 12px", background: bgInner, border: `1px solid ${borderCard}`, borderRadius: "8px" }}>
                  <span>
                    {item.type === "paragraf" 
                      ? `📖 Paragraf — ${item.date} — ${item.count} soru (${formatClock(item.seconds)})`
                      : `${item.subject} — ${item.date} — ${formatMinutes(item.minutes)}`
                    }
                  </span>
                  <button onClick={() => deleteSession(item.id)} style={{ background: "transparent", color: "#F43F5E", border: "none", cursor: "pointer", fontWeight: "bold" }}>Sil</button>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<StudyTracker />);
  </script>
</body>
</html>
